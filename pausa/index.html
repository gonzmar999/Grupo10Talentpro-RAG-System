<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6A64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pausa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Pausa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: una sola columna calma (máx. 560px), acciones grandes arriba, navegación inferior fija con el pulgar */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E6ECEA; --fg:#1B2421; --muted:#5A6964; --line:#D2DBD8;
  --accent:#2E6A64; --accent-fg:#FFFFFF; --accent-soft:#D9E9E5; --warn:#8A5512; --warn-soft:#F4E7D2;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --surface-2:#222D2A; --fg:#E3EBE8; --muted:#9AAAA5; --line:#2D3A36;
  --accent:#86BFB6; --accent-fg:#0D1714; --accent-soft:#1F3532; --warn:#E3AE6C; --warn-soft:#332818; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --surface-2:#222D2A; --fg:#E3EBE8; --muted:#9AAAA5; --line:#2D3A36;
  --accent:#86BFB6; --accent-fg:#0D1714; --accent-soft:#1F3532; --warn:#E3AE6C; --warn-soft:#332818; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{padding-block:20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.35rem;line-height:1.2}
h3{font-size:1.1rem;line-height:1.25}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.note.warn{background:var(--warn-soft);color:var(--fg)}
.note.warn .eyebrow{color:var(--warn)}
.note.accent{background:var(--accent-soft)}

.btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-align:center}
a.btn{text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);min-height:44px;padding:0 10px}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:12px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{grid-column:1/-1;min-height:96px;border-radius:20px;font-size:1.3rem;font-family:var(--f-display);font-weight:500;flex-direction:column;gap:2px}
.big small{font-family:var(--f-body);font-size:.85rem;font-weight:400;opacity:.85}
.mid{min-height:64px;flex-direction:column;gap:0}
.mid small{font-weight:400;font-size:.8rem;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.scale.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.scale .chip{padding:0;border-radius:10px;justify-content:center;font-variant-numeric:tabular-nums}
.scale.five .chip{font-size:.8rem;line-height:1.1;padding:4px 2px;min-height:52px;text-align:center}
.scale-l{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.emo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.emo .chip{flex-direction:column;justify-content:center;border-radius:14px;min-height:74px;padding:6px 2px;font-size:.85rem;gap:4px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.lab{font-weight:700}
input[type=text],input[type=tel],textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:84px;resize:vertical}
.hint{font-size:.85rem;color:var(--muted)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .t{font-variant-numeric:tabular-nums;color:var(--muted);min-width:44px;font-size:.9rem}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.toolrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.toolrow .ico{color:var(--accent)}

/* Navegación */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--nav-h)}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;color:var(--muted);cursor:pointer}
#nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* Pantallas superpuestas */
#ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#ov .wrap{padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
.ovhead{display:flex;align-items:center;gap:8px;justify-content:space-between}
.steps{display:flex;gap:5px}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.footer-btns{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}

/* Respiración */
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.breath-box{width:220px;height:220px;max-width:100%;display:grid;place-items:center;position:relative}
.breath-c{width:220px;height:220px;max-width:100%;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);transform:scale(.45);transition:transform 4s ease-in-out}
.breath-c.in{transform:scale(1)}
.breath-l{position:absolute;font-family:var(--f-display);font-size:1.4rem}
@media (prefers-reduced-motion: reduce){.breath-c{transition:none!important;transform:scale(.8)}.breath-c.in{transform:scale(.8)}}

.surf canvas{width:100%;height:180px;display:block;border-radius:12px;background:var(--surface)}
.big-num{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}

/* Gráficos */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .bar{fill:var(--surface-2)}
.chart .bar.hot{fill:var(--accent)}
.chart .l1{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .l2{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 4}
.chart .area{fill:var(--accent-soft);opacity:.8}
.chart .dot1{fill:var(--accent)}
.chart .dot2{fill:var(--muted)}
.chart .end{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.hbar{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) 2.6rem;gap:10px;align-items:center;font-size:.9rem}
.hbar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:5px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:3px;border-radius:2px;background:var(--accent);display:inline-block}
.sw.d{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 8px)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .val{font-family:var(--f-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.tile .cmp{font-size:.82rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
details.lib{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 16px}
details.lib summary{cursor:pointer;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.lib summary::-webkit-details-marker{display:none}
details.lib[open] summary{border-bottom:1px solid var(--line)}
details.lib .body{padding:12px 0 16px;display:flex;flex-direction:column;gap:8px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--muted);font-weight:700}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.8rem}

.btn.crisis{background:var(--fg);border-color:var(--fg);color:var(--bg);min-height:60px;font-size:1.05rem;justify-content:space-between;padding:0 18px}
.btn.crisis small{font-weight:400;opacity:.85;font-size:.85rem}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.meal{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;min-height:56px}
.meal .mt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meal.ok{background:var(--accent-soft);border-color:transparent}
.meal.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice{display:grid;gap:12px}
.choice .btn{min-height:112px;flex-direction:column;gap:6px;border-radius:20px;font-family:var(--f-display);font-size:1.4rem;font-weight:500}
.choice .btn small{font-family:var(--f-body);font-size:.9rem;font-weight:400;opacity:.9}
.timer{font-family:var(--f-display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.bar-p{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
input[type=time],input[type=date],select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:44px;box-sizing:border-box}
.mealrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.mealrow input[type=checkbox],.envrow input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.envrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.ifthen p{margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:min(90vw,480px);box-sizing:border-box;font-size:.95rem}
</style>

<main id="app" class="wrap" aria-live="polite"></main>
<nav id="nav" aria-label="Secciones"><div class="wrap">
  <button data-a="tab" data-v="inicio"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>Inicio</button>
  <button data-a="tab" data-v="ansiedad"><svg class="ico" viewBox="0 0 24 24"><path d="M3 9c3-3 6 3 9 0s6 3 9 0"/><path d="M3 15c3-3 6 3 9 0s6 3 9 0"/></svg>Ansiedad</button>
  <button data-a="tab" data-v="patrones"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>Patrones</button>
  <button data-a="tab" data-v="progreso"><svg class="ico" viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Progreso</button>
  <button data-a="tab" data-v="mas"><svg class="ico" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg>Más</button>
</div></nav>
<div id="ov" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(()=>{
'use strict';
const KEY='pausa.v1';
const IS_PWA=!!document.querySelector('link[rel="manifest"]');
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const DAY=864e5;
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dShort=t=>{const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)};
const avg=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const r1=x=>x==null?'–':(Math.round(x*10)/10).toLocaleString('es-AR');
const pct=x=>x==null?'–':Math.round(x*100)+' %';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- Catálogos ---------- */
const I={
  estres:'<path d="M3 13l4-7 4 12 4-12 4 7h2"/>',
  aburrimiento:'<circle cx="12" cy="12" r="9"/><path d="M9 15h6"/><path d="M9 10h.01M15 10h.01"/>',
  cansancio:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  ansiedad:'<path d="M3 9c3-3 6 3 9 0s6 3 9 0"/><path d="M3 15c3-3 6 3 9 0s6 3 9 0"/>',
  tristeza:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
  festejo:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
  otro:'<circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
  wind:'<path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/>',
  hand:'<path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3 14a1.6 1.6 0 0 1 2.6-1.8L8 15"/>',
  note:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/>',
  stop:'<path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="M9 12h6"/>',
  distance:'<path d="M4 12h16"/><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/>',
  wave:'<path d="M2 16c4 0 4-10 8-10s4 10 8 10 2-3 4-3"/>'
};
const ic=(k,cls='ico')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[k]||''}</svg>`;
const EMO=[['estres','Estrés'],['aburrimiento','Aburrimiento'],['cansancio','Cansancio'],['ansiedad','Ansiedad'],['tristeza','Tristeza'],['festejo','Festejo'],['otro','Otro']];
const SIT=[['trabajo','Trabajo'],['casa','Casa'],['auto','Auto'],['reunion','Reunión'],['despues','Después de comer'],['noche','Noche']];
const HUNGER=[['fisica','Física'],['emocional','Emocional'],['nose','No sé']];
const DID=[['crisis','Usé el modo crisis'],['sos','Usé el SOS'],['herramienta','Usé otra herramienta'],['espere','Lo dejé pasar'],['alternativa','Hice otra cosa'],['dulce','Comí dulce'],['nada','Todavía nada']];
const CONTROL=[['no','No'],['algo','Un poco'],['si','Sí']];
const MANAGED=['crisis','sos','herramienta','espere','alternativa'];
const L=arr=>Object.fromEntries(arr);
const EMO_L=L(EMO),SIT_L=L(SIT),HUNGER_L=L(HUNGER),DID_L=L(DID);
const TOOLS={
  resp:{n:'Respiración lenta',e:'DBT · respiración pautada',d:'1 min',i:'wind'},
  ground:{n:'Grounding 5-4-3-2-1',e:'Anclaje sensorial (TCC / DBT)',d:'2 min',i:'hand'},
  tcc:{n:'Registro de pensamiento',e:'TCC · Judith Beck',d:'3 min',i:'note'},
  stop:{n:'STOP y TIPP',e:'DBT · regulación emocional',d:'1–3 min',i:'stop'},
  defu:{n:'Defusión',e:'ACT',d:'1 min',i:'distance'},

const since=days=>{const from=Date.now()-days*DAY;return S.log.filter(e=>e.ts>=from)};
function tally(key,arr){const m={};arr.forEach(e=>{const k=e[key];if(!k)return;(m[k]=m[k]||{n:0,sum:0});m[k].n++;m[k].sum+=e.int||0});return Object.entries(m).map(([k,v])=>({k,n:v.n,avg:v.sum/v.n})).sort((a,b)=>b.n-a.n)}
function analyze(days){
  const Lg=since(days),cr=Lg.filter(e=>e.kind==='antojo');
  const a={n:cr.length,cr};
  const hours=Array.from({length:24},()=>({n:0,sum:0}));
  cr.forEach(e=>{const h=new Date(e.ts).getHours();hours[h].n++;hours[h].sum+=e.int||0});
  a.hours=hours;
  let best=0,bh=null;
  for(let h=0;h<24;h++){const s=hours[h].sum+hours[(h+1)%24].sum;if(s>best){best=s;bh=h}}
  a.peak=bh==null?null:{start:bh,end:(bh+2)%24};
  a.emo=tally('emo',cr);a.sit=tally('sit',cr);
  if(a.peak){const inP=cr.filter(e=>{const h=new Date(e.ts).getHours();return h===a.peak.start||h===(a.peak.start+1)%24});a.peakN=inP.length;a.peakEmo=tally('emo',inP)[0]}
  a.avgInt=avg(cr.map(e=>e.int));
  const withH=cr.filter(e=>e.hunger);
  a.emotional=withH.length?withH.filter(e=>e.hunger==='emocional').length/withH.length:null;
  const byDay={};cr.forEach(e=>{(byDay[dk(e.ts)]=byDay[dk(e.ts)]||[]).push(e.int)});
  const rel=(f)=>{const lo=[],hi=[];Object.entries(byDay).forEach(([d,ints])=>{const m=S.checkins[d]&&S.checkins[d].m;if(!m)return;const v=avg(ints);if(m[f]<=2)lo.push(v);else if(m[f]>=4)hi.push(v)});return{lo:avg(lo),hi:avg(hi),nlo:lo.length,nhi:hi.length}};
  a.sleep=rel('sleep');a.stress=rel('stress');
  const sos=Lg.filter(e=>e.kind==='sos'&&e.before!=null&&e.after!=null);
  a.sos={n:sos.length,drop:avg(sos.map(e=>e.before-e.after))};
  const tl={};Lg.filter(e=>e.kind==='ansiedad'&&e.before!=null&&e.after!=null).forEach(e=>{(tl[e.tool]=tl[e.tool]||[]).push(e.before-e.after)});
  a.anxTools=Object.entries(tl).map(([k,v])=>({k,n:v.length,drop:avg(v)})).sort((x,y)=>y.drop-x.drop);
  const crs=Lg.filter(e=>e.kind==='crisis'&&e.before!=null&&e.after!=null);
  a.crisis={n:crs.length,drop:avg(crs.map(e=>e.before-e.after))};
  a.outcomes=tally('did',cr);
  a.managed=cr.length?cr.filter(e=>MANAGED.includes(e.did)).length/cr.length:null;
  return a;
}

function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function weeks(nw){
  const cur=weekStart(Date.now()),out=[];
  for(let i=nw-1;i>=0;i--){
    const s0=new Date(cur);s0.setDate(s0.getDate()-7*i);const s=s0.getTime();const e0=new Date(s);e0.setDate(e0.getDate()+7);const e=e0.getTime();
    const cr=S.log.filter(x=>x.kind==='antojo'&&x.ts>=s&&x.ts<e);
    const ck=Object.entries(S.checkins).filter(([d])=>{const t=new Date(d+'T12:00').getTime();return t>=s&&t<e}).map(([,v])=>v).filter(c=>c.n);
    out.push({s,n:cr.length,int:avg(cr.map(x=>x.int)),managed:cr.length?cr.filter(x=>MANAGED.includes(x.did)).length/cr.length:null,anx:avg(ck.map(c=>c.n.anx)),regular:ck.filter(c=>c.n.regular).length,nights:ck.length,episodes:cr.filter(x=>x.control==='si').length});
  }
  return out;
}
function safety(){
  const ep=since(14).filter(e=>e.kind==='antojo'&&e.control==='si').length;
  const ep7=since(7).filter(e=>e.kind==='antojo'&&e.control==='si').length;
  const w=weeks(4).map(x=>x.episodes);
  const rising=w[1]<w[2]&&w[2]<w[3]&&w[3]>=2;
  const ints=weeks(4).map(x=>x.int);
  const worse=ints.every(x=>x!=null)&&ints[1]<ints[2]&&ints[2]<ints[3]&&ints[3]-ints[1]>=1.5;
  return ep>=4||ep7>=2||rising||worse?{ep,ep7,rising,worse}:null;
}

const mins=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const mealsOn=()=>S.settings.meals.filter(m=>m.on).sort((a,b)=>mins(a.t)-mins(b.t));
const idea=id=>{const a=IDEAS[id]||IDEAS.merienda;return a[new Date().getDate()%a.length]};
function mealState(){
  const done=S.meals[dk(Date.now())]||{},ms=mealsOn(),nm=nowMin();
  const next=ms.find(m=>!done[m.id]&&mins(m.t)>=nm-60)||null;
  const lastTs=Math.max(0,...Object.values(done));
  let gap=null;
  if(ms.length&&nm<mins(ms[ms.length-1].t)+60){
    if(!lastTs&&nm>mins(ms[0].t)+90)gap='none';
    else if(lastTs&&Date.now()-lastTs>4*36e5&&next)gap='long';
  }
  return{done,ms,next,gap,lastTs};
}

}

function startBreath(cycles,onDone){

function surfHTML(){
  const d=FORM.dur||'90';
  return `<div class="surf stack"><canvas id="surfc" aria-label="Curva de un impulso que sube y baja"></canvas>

function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawSurf(p){
  const cv=$('#surfc');if(!cv)return;
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle=tok('--surface');x.fillRect(0,0,W,H);
  const f=u=>{const b=u<.35?(1-Math.cos(Math.PI*u/.35))/2:(1+Math.cos(Math.PI*(u-.35)/.65))/2;return .12+.82*b+.025*Math.sin(u*38)};
  const px=u=>12+u*(W-24),py=v=>H-14-v*(H-34);
  x.strokeStyle=tok('--line');x.lineWidth=1;x.beginPath();x.moveTo(12,py(0));x.lineTo(W-12,py(0));x.stroke();
  x.strokeStyle=tok('--line');x.lineWidth=2;x.beginPath();for(let i=0;i<=200;i++){const u=i/200;i?x.lineTo(px(u),py(f(u))):x.moveTo(px(u),py(f(u)))}x.stroke();
  if(p>0){
    x.fillStyle=tok('--accent-soft');x.beginPath();x.moveTo(px(0),py(0));for(let i=0;i<=200*p;i++){const u=i/200;x.lineTo(px(u),py(f(u)))}x.lineTo(px(p),py(0));x.closePath();x.fill();
    x.strokeStyle=tok('--accent');x.lineWidth=3;x.beginPath();for(let i=0;i<=200*p;i++){const u=i/200;i?x.lineTo(px(u),py(f(u))):x.moveTo(px(u),py(f(u)))}x.stroke();
    x.fillStyle=tok('--accent');x.beginPath();x.arc(px(p),py(f(p)),7,0,Math.PI*2);x.fill();
  }
  x.fillStyle=tok('--muted');x.font='11px '+tok('--f-body');x.fillText('pico',px(.35)-12,14);
}
function startSurf(onDone){
  clearTimers();const dur=+(FORM.dur||90)*1000,t0=performance.now();
  const msg=$('#ov .surf-msg'),tl=$('#ov .surf-t'),go=$('#ov .surf-go');go.hidden=true;
  const step=now=>{const p=Math.min(1,(now-t0)/dur);drawSurf(p);
    msg.textContent=p<.25?'Está subiendo. No tenés que hacer nada con él, solo mirarlo.':p<.45?'Está cerca del techo. Ningún impulso sube para siempre.':p<.8?'Empieza a bajar. Notá cómo cambia en el cuerpo.':'La ola se va. Seguí respirando un momento más.';
    tl.textContent=Math.ceil((1-p)*dur/1000)+' s';
    if(p<1)raf=requestAnimationFrame(step);else{raf=null;msg.textContent='La ola pasó. Podés repetirla si el impulso sigue alto.';tl.textContent='';onDone&&onDone()}};
  raf=requestAnimationFrame(step);
}

function hourChart(a){
  const W=336,H=150,b=a.hours,max=Math.max(1,...b.map(h=>h.n)),bw=(W-20)/24;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Antojos por hora del día">`;
  [0,.5,1].forEach(g=>{const y=12+(1-g)*(H-40);s+=`<line class="grid" x1="10" x2="${W-10}" y1="${y}" y2="${y}"/>`});
  b.forEach((h,i)=>{const bh=(h.n/max)*(H-40),x=10+i*bw+1.5,y=12+(H-40)-bh;const hot=a.peak&&(i===a.peak.start||i===(a.peak.start+1)%24);s+=`<rect class="bar ${hot?'hot':''}" x="${x}" y="${y}" width="${bw-3}" height="${Math.max(bh,h.n?2:0)}" rx="2"><title>${i} h: ${h.n} antojos</title></rect>`});
  [0,6,12,18].forEach(hh=>{s+=`<text class="lbl" x="${10+hh*bw}" y="${H-10}">${hh} h</text>`});
  s+=`<text class="lbl" x="${W-10}" y="${H-10}" text-anchor="end">24 h</text><text class="lbl" x="${W-10}" y="10" text-anchor="end">máx. ${max}</text></svg>`;
  return s;
}
function lineChart(ws){
  const W=336,H=170,X0=26,X1=W-12,Y0=12,Y1=H-28,n=ws.length;
  const px=i=>X0+(n<2?0:i*(X1-X0)/(n-1)),py=v=>Y1-(v/10)*(Y1-Y0);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Intensidad del antojo y ansiedad por semana">`;
  [0,5,10].forEach(v=>{s+=`<line class="grid" x1="${X0}" x2="${X1}" y1="${py(v)}" y2="${py(v)}"/><text class="lbl" x="${X0-6}" y="${py(v)+3}" text-anchor="end">${v}</text>`});
  const path=k=>{let d='',pts=[];ws.forEach((w,i)=>{if(w[k]==null)return;pts.push([px(i),py(w[k])]);d+=(d?'L':'M')+px(i).toFixed(1)+' '+py(w[k]).toFixed(1)});return{d,pts}};
  const a=path('int'),b=path('anx');
  if(a.pts.length>1)s+=`<path class="area" d="${a.d}L${a.pts[a.pts.length-1][0]} ${Y1}L${a.pts[0][0]} ${Y1}Z"/>`;
  if(b.d)s+=`<path class="l2" d="${b.d}"/>`;b.pts.forEach(p=>s+=`<circle class="dot2" cx="${p[0]}" cy="${p[1]}" r="2.5"/>`);
  if(a.d)s+=`<path class="l1" d="${a.d}"/>`;a.pts.forEach((p,i)=>s+=i===a.pts.length-1?`<circle class="end" cx="${p[0]}" cy="${p[1]}" r="5"/>`:`<circle class="dot1" cx="${p[0]}" cy="${p[1]}" r="3"/>`);
  ws.forEach((w,i)=>{if(n<=8||i%2===0)s+=`<text class="lbl" x="${px(i)}" y="${H-10}" text-anchor="middle">${dShort(w.s)}</text>`});
  return s+'</svg>';
}
function hbars(rows,labels,total){

  const ws=weeks(8),cur=ws[7],prev=ws[6];

  const head=`<header class="stack-s"><p class="eyebrow">Semana a semana</p><h1>Progreso</h1><p class="muted">Se muestra la tendencia. Un día difícil no borra nada.</p></header>`;
  if(has.length<1)return head+`<div class="card"><p class="muted">Cuando tengas registros, acá vas a ver la comparación semanal.</p></div>`;
  const cmp=(c,p,fmt,better)=>{if(c==null||p==null)return 'Sin dato de la semana anterior';const d=c-p;if(Math.abs(d)<.05)return 'Igual que la semana anterior';return `${d<0?'Bajó':'Subió'} desde ${fmt(p)}${(better==='down'?d<0:d>0)?' · en la dirección buscada':''}`};
  const first=ws.filter(w=>w.int!=null).slice(0,2),last=ws.filter(w=>w.int!=null).slice(-2);
  const goal=(k,dir)=>{const f=avg(first.map(w=>w[k])),l=avg(last.map(w=>w[k]));if(f==null||l==null||has.length<4)return null;return dir==='down'?l<f:l>f};
  const g=[['Intensidad del antojo','int','down'],['Antojos manejados','managed','up'],['Ansiedad','anx','down']].map(([l,k,d])=>[l,goal(k,d)]);
  return head+`
  <div class="tiles">
    <div class="tile"><span class="eyebrow">Intensidad media</span><span class="val">${r1(cur.int)}</span><span class="cmp">${cmp(cur.int,prev.int,r1,'down')}</span></div>
    <div class="tile"><span class="eyebrow">Manejados</span><span class="val">${pct(cur.managed)}</span><span class="cmp">${cmp(cur.managed,prev.managed,pct,'up')}</span></div>
    <div class="tile"><span class="eyebrow">Ansiedad media</span><span class="val">${r1(cur.anx)}</span><span class="cmp">${cmp(cur.anx,prev.anx,r1,'down')}</span></div>
    <div class="tile"><span class="eyebrow">Días en horario</span><span class="val">${cur.regular}<span class="muted" style="font-size:1rem"> / ${cur.nights}</span></span><span class="cmp">De las noches con check-in</span></div>
  </div>
  <p class="hint">Esta semana va de lunes a hoy.</p>
  <section class="card"><div class="stack-s"><h2>Últimas 8 semanas</h2><div class="legend"><span><i class="sw"></i>Intensidad del antojo</span><span><i class="sw d"></i>Ansiedad del día</span></div></div>${lineChart(ws)}</section>
  <section class="card"><h2>Criterio de éxito</h2><p class="muted small">Lo que buscás ver en 4 a 8 semanas, comparando tus primeras semanas con las últimas.</p>
    <div class="list">${g.map(([l,ok])=>`<div class="li"><span class="grow">${l}</span><span class="pill ${ok?'ok':''}">${ok==null?'Faltan semanas':ok?'En la dirección buscada':'Todavía no'}</span></div>`).join('')}</div></section>
  <section class="card"><h2>Detalle semanal</h2><div class="tbl"><table><thead><tr><th>Semana</th><th>Antojos</th><th>Intens.</th><th>Manejados</th><th>Ansiedad</th><th>Pérdida de control</th></tr></thead><tbody>
    ${ws.slice().reverse().map(w=>`<tr><td>${dShort(w.s)}</td><td>${w.n}</td><td>${r1(w.int)}</td><td>${pct(w.managed)}</td><td>${r1(w.anx)}</td><td>${w.episodes}</td></tr>`).join('')}
  </tbody></table></div><p class="hint">Los episodios de pérdida de control se cuentan como un dato más para entender el patrón.</p></section>`;
};

function sessionSummary(){
  const ss=S.settings.session,from=ss.last?new Date(ss.last+'T00:00').getTime():Date.now()-14*DAY,days=Math.max(1,Math.round((Date.now()-from)/DAY));
  const Lg=S.log.filter(e=>e.ts>=from),cr=Lg.filter(e=>e.kind==='antojo'),a=analyze(days);
  const prev=S.log.filter(e=>e.kind==='antojo'&&e.ts<from&&e.ts>=from-days*DAY);
  const crs=Lg.filter(e=>e.kind==='crisis'&&e.before!=null),chains=Lg.filter(e=>e.kind==='cadena'),notes=S.notes.filter(n=>!n.done);
  const nights=Object.entries(S.checkins).filter(([d,c])=>c.n&&new Date(d+'T12:00').getTime()>=from).map(([,c])=>c.n);
  const o=[`Resumen de Pausa · ${dShort(from)} al ${dShort(Date.now())} (${days} días)`,''];
  o.push(`Antojos registrados: ${cr.length} · intensidad media ${r1(avg(cr.map(e=>e.int)))}${prev.length?` (período anterior: ${r1(avg(prev.map(e=>e.int)))})`:''}`);
  o.push(`Manejados con una herramienta: ${pct(a.managed)}`);
  o.push(`Episodios con pérdida de control: ${cr.filter(e=>e.control==='si').length}`);
  if(crs.length)o.push(`Modo crisis: ${crs.length} ${crs.length===1?'uso':'usos'} · bajó ${r1(avg(crs.map(e=>e.before-e.after)))} puntos en promedio`);
  if(nights.length)o.push(`Ansiedad media del día: ${r1(avg(nights.map(n=>n.anx)))} · días con comidas en horario: ${nights.filter(n=>n.regular).length} de ${nights.length}`);
  const ins=insights(a).slice(0,4);if(ins.length){o.push('','Patrones:');ins.forEach(x=>o.push('- '+x))}
  if(chains.length){o.push('','Análisis en cadena:');chains.forEach(c=>o.push(`- ${dShort(c.ts)}: ${c.trig||'sin desencadenante anotado'}${c.cut?' → cortar en: '+c.cut:''}`))}
  if(notes.length){o.push('','Mis notas:');notes.forEach(n=>o.push('- '+n.text))}
  return o.join('\n');
}

function render(scrollTop){
  $('#app').innerHTML=VIEWS[V.tab]();
  $$('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===V.tab?'page':'false'));
  if(scrollTop)window.scrollTo(0,0);
  bindForms();
}
function bindForms(){
  const on=(id,fn)=>{const f=$('#'+id);if(f)f.onsubmit=e=>{e.preventDefault();fn(f)}};
  on('f-contact',()=>{const name=$('#c-name').value.trim(),phone=$('#c-phone').value.trim();if(!name&&!phone){toast('Escribí al menos un nombre o un teléfono');return}S.settings.contacts.push({name,phone,note:$('#c-note').value.trim()});save();toast('Contacto agregado');render()});
  on('f-msg',()=>{S.settings.message=$('#m-txt').value.trim()||DEFAULT_MSG;save();toast('Mensaje guardado')});
  on('f-alt',()=>{const v=$('#alt-in').value.trim();if(!v)return;S.settings.alts.push(v);save();render()});
  on('f-ifthen',()=>{const a=$('#if-a').value.trim(),b=$('#if-b').value.trim();if(!a||!b){toast('Completá las dos partes');return}S.relapse.ifthen.push({if:a,then:b});save();render()});
  on('f-meals',()=>{S.settings.meals.forEach(m=>{m.on=$('#m-on-'+m.id).checked;const t=$('#m-t-'+m.id).value;if(t)m.t=t});save();getPlan(true);scheduleReminder();toast('Horarios guardados')});
  on('f-ses',()=>{S.settings.session.next=$('#ses-next').value;S.settings.session.freq=+$('#ses-freq').value;save();toast('Sesión guardada');render()});
  on('f-note',()=>{const t=$('#note-txt').value.trim();if(!t)return;addNote(t);toast('Nota guardada');render()});
  $$('form[data-list]').forEach(f=>{f.onsubmit=e=>{e.preventDefault();const v=$('input',f).value.trim();if(!v)return;S.relapse[f.dataset.list].push(v);save();render()}});
  const ff=$('#imp-file');if(ff)ff.onchange=()=>{const f=ff.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp-txt').value=r.result};r.readAsText(f)};
}
function addNote(text){S.notes.push({id:uid(),ts:Date.now(),text,done:false});save()}

  <div class="field"><span class="lab">Hambre</span>${chips('hunger',HUNGER)}<p class="hint">Física: aparece de a poco y cualquier comida te sirve. Emocional: aparece de golpe y pide algo puntual.</p></div>
  ${mode==='antojo'?`<div class="field"><span class="lab">Qué hice</span>${chips('did',DID)}</div>`:''}

}
function saveLog(next){
  if(!FORM.int){toast('Elegí la intensidad del 1 al 10');return}
  const did=next==='sos'?'sos':FORM.did||(FORM.mode==='dulce'?'dulce':'nada');
  const e={id:uid(),kind:'antojo',ts:Date.now(),int:+FORM.int,emo:FORM.emo||null,sit:FORM.sit||null,hunger:FORM.hunger||null,did};

  if(did==='dulce'){openOv(`${head('Quedó registrado')}<div class="note"><p>Es un dato más para entender tu patrón.</p><p>Tu próxima comida va en su horario de siempre, sin saltearla ni compensar. Saltear comidas suele aumentar el antojo después.</p></div>
    <div class="card"><p class="lab">Si querés, en un rato podés probar:</p><div class="stack"><button class="btn soft" data-a="tool" data-v="defu">Defusión: «ya arruiné el día»</button><button class="btn soft" data-a="tool" data-v="resp">Respiración lenta</button></div></div>
    <div class="footer-btns"><button class="btn primary block" data-a="close">Volver al inicio</button></div>`);return}

/* SOS antojo */
let SOS=null;
const SOS_STEPS=6;
function openSOS(linked){
  clearTimers();
  FORM={before:linked?String(linked.int):null,dur:'90',body:[],alt:null,after:null};
  SOS={step:0,linked:linked||null,what:''};renderSOS();
}
function renderSOS(){
  clearTimers();
  const s=SOS.step,dots=`<div class="steps" aria-label="Paso ${s+1} de ${SOS_STEPS}">${Array.from({length:SOS_STEPS},(_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
  const cs=S.settings.contacts;
  const contact=cs.length?`<button class="btn sm ghost" data-a="sosContact">${ic('phone')} ${esc(cs[0].name||'Mi contacto')}</button>`:'';
  const titles=['Nombrá el antojo','Surfeá el impulso','Respirá','Mirá con curiosidad','Elegí una acción','¿Cómo está el antojo ahora?','Resultado'];
  let body='',next='Seguir';
  if(s===0)body=`<p class="muted">Ponerle nombre ya crea un poco de distancia.</p><div class="field"><label for="sos-what">Tengo ganas de…</label><input type="text" id="sos-what" value="${esc(SOS.what)}" placeholder="Ej.: algo de chocolate"></div><div class="field"><span class="lab">¿Qué tan fuerte es ahora?</span>${scale('before')}</div>`;
  if(s===1)body=surfHTML();
  if(s===2)body=`<p class="muted">Exhalá más largo de lo que inhalás.</p>${breathHTML(6)}`;
  if(s===3)body=`<p>¿Qué sentís en el cuerpo ahora?</p><p class="muted">Mirá la sensación con interés: dónde está, si tiene borde, si cambia mientras la mirás.</p>${chips('body',BODY.map(b=>[b,b]),{multi:true})}`;
  if(s===4)body=`<p class="muted">Elegí algo de tu lista para hacer ahora mismo.</p>${chips('alt',S.settings.alts.map(a=>[a,a]))}`;
  if(s===5){body=scale('after');next='Guardar'}
  if(s===6){const b=+FORM.before,a=+FORM.after,d=b-a;
    body=`<div class="card"><div class="row" style="gap:24px"><div class="stack-s"><span class="eyebrow">Al empezar</span><span class="big-num">${b}</span></div><span class="muted" aria-hidden="true">→</span><div class="stack-s"><span class="eyebrow">Ahora</span><span class="big-num">${a}</span></div></div>
    <p>${d>0?`Bajó ${d} ${d===1?'punto':'puntos'}.`:d===0?'Quedó igual. A veces el impulso necesita más tiempo.':'Subió un poco. Pasa, y también es información útil.'}</p></div>
    ${FORM.alt?`<p>Tu acción ahora: <b>${esc(FORM.alt)}</b>.</p>`:''}${a>=6?'<p class="muted">Si sigue alto, podés repetir el surf o escribirle a tu contacto.</p>':''}`}
  openOv(`${head(titles[s],s<6?dots:'')}${contact?`<div>${contact}</div>`:''}<div id="sos-body" class="stack">${body}</div>
  <div class="footer-btns">${s<6?`<button class="btn primary block" data-a="sosNext">${next}</button>${s>=1&&s<=4?'<button class="btn ghost" data-a="sosNext" data-v="skip">Saltear este paso</button>':''}`:`<button class="btn primary block" data-a="close">Volver al inicio</button><button class="btn block" data-a="sosAgain">Repetir el surf</button>`}</div>`);
  if(s===1)requestAnimationFrame(()=>drawSurf(0));
}
function sosNext(skip){
  const s=SOS.step;
  if(s===0){SOS.what=$('#sos-what').value.trim();if(!FORM.before){toast('Elegí qué tan fuerte es, del 1 al 10');return}}
  if(s===5){if(!FORM.after){toast('Elegí un número del 1 al 10');return}
    S.log.push({id:uid(),kind:'sos',ts:Date.now(),before:+FORM.before,after:+FORM.after,alt:FORM.alt||null,what:SOS.what||null,body:FORM.body});
    if(SOS.linked){const e=S.log.find(x=>x.id===SOS.linked.id);if(e)e.did='sos'}
    else S.log.push({id:uid(),kind:'antojo',ts:Date.now()-1,int:+FORM.before,did:'sos'});
    save();
  }
  SOS.step++;renderSOS();
}

/* Herramientas de ansiedad */
let TS=null;
const GROUND=[[5,'cosas que ves'],[4,'cosas que podés tocar'],[3,'sonidos que oís'],[2,'olores que notás'],[1,'sabor en la boca']];
const BECK=[['Me lo merezco','Me merezco sentirme bien, y hay otras formas de cuidarme que no me dejan peor después.'],['Ya arruiné el día','Un momento no define el día. La próxima comida puede ser en su horario, como siempre.'],['Uno solo no hace nada','Puede que no, pero cada vez que espero un poco practico que el impulso pasa.'],['No lo aguanto','Es incómodo, no insoportable. Los antojos suben y bajan.']];
function openTool(id){FORM={};TS={id,step:'pre',g:0};renderTool()}
function renderTool(){
  clearTimers();

  if(TS.step==='run'){
    if(TS.id==='resp')body=breathHTML(6);
    if(TS.id==='surf')body=`<p class="muted">Sirve para un antojo o para la ansiedad. Ubicá la sensación en el cuerpo y miralá como una ola.</p>${surfHTML()}`;
    if(TS.id==='ground'){const g=GROUND[TS.g];body=TS.g<GROUND.length?`<div class="card" style="align-items:flex-start"><span class="big-num">${g[0]}</span><p style="font-size:1.2rem">Nombrá ${g[0]} ${g[1]}.</p><p class="muted small">Decilas en voz baja o en tu cabeza, sin apurarte.</p></div><button class="btn soft" data-a="groundNext">Listo, siguiente</button>`:`<div class="note accent"><p>Terminaste los cinco pasos.</p></div>`}
    if(TS.id==='tcc')body=`<div class="field"><label for="t-sit">Situación</label><textarea id="t-sit" placeholder="¿Dónde estabas, qué pasaba?"></textarea></div>
      <div class="field"><label for="t-th">Pensamiento automático</label><textarea id="t-th" placeholder="¿Qué te dijiste?"></textarea><div class="chips">${BECK.map((b,i)=>`<button class="chip" type="button" data-a="beck" data-v="${i}">«${b[0]}»</button>`).join('')}</div></div>
      <div class="field"><label for="t-ev">Evidencia a favor y en contra</label><textarea id="t-ev" placeholder="¿Qué datos lo apoyan? ¿Cuáles no?"></textarea></div>
      <div class="field"><label for="t-alt">Respuesta alternativa</label><textarea id="t-alt" placeholder="¿Qué le dirías a alguien que querés en tu lugar?"></textarea></div>`;
    if(TS.id==='stop')body=`<div class="card"><h3>STOP</h3><div class="list">${[['Pará','Quedate quieto un momento. No actúes todavía.'],['Tomá distancia','Respirá una vez profundo. Alejate un paso, también físicamente.'],['Observá','¿Qué pasa afuera? ¿Qué sentís y pensás adentro?'],['Seguí con atención','Preguntate qué te conviene ahora, y hacé eso.']].map(([a,b])=>`<div class="li"><b style="min-width:7.5rem">${a}</b><span class="grow">${b}</span></div>`).join('')}</div></div>
      <div class="card"><h3>TIPP, para bajar rápido una emoción muy intensa</h3><div class="list">${[['Temperatura','Agua fría en la cara unos 30 segundos. Si tenés un problema cardíaco, consultalo antes.'],['Intensidad','1 o 2 minutos de movimiento intenso: subir escaleras, saltar. Es para regular la emoción.'],['Respiración pautada','Exhalación más larga que la inhalación.'],['Relajación muscular','Tensá un grupo de músculos 5 segundos y soltalo mientras exhalás.']].map(([a,b])=>`<div class="li"><b style="min-width:7.5rem">${a}</b><span class="grow">${b}</span></div>`).join('')}</div></div>`;
    if(TS.id==='defu')body=`<div class="field"><label for="d-in">Escribí el pensamiento tal como aparece</label><input type="text" id="d-in" placeholder="Ej.: no voy a poder parar"></div><button class="btn soft" data-a="defuGo">Mirarlo con distancia</button><div id="d-out" class="stack"></div>`;
    foot=`<button class="btn primary block" data-a="toolNext">Terminé</button>`;
  }
  if(TS.step==='post'){body=`<div class="field"><span class="lab">¿Y ahora, cuánta ansiedad sentís?</span>${scale('after','poca','muchísima')}</div>`;foot=`<button class="btn primary block" data-a="toolNext">Guardar</button>`}
  if(TS.step==='done'){const b=+FORM.before,a=+FORM.after,d=b-a;body=`<div class="card"><div class="row" style="gap:24px"><div class="stack-s"><span class="eyebrow">Antes</span><span class="big-num">${b}</span></div><span class="muted" aria-hidden="true">→</span><div class="stack-s"><span class="eyebrow">Después</span><span class="big-num">${a}</span></div></div><p>${d>0?`Bajó ${d} ${d===1?'punto':'puntos'}.`:d===0?'Quedó igual. Podés probar otra herramienta.':'Subió un poco. Probá otra herramienta o escribile a tu contacto.'}</p></div>`;foot=`<button class="btn primary block" data-a="close">Listo</button><button class="btn block" data-a="tab" data-v="ansiedad">Ver otras herramientas</button>`}
  openOv(`${head(t.n,`<span class="eyebrow">${TS.step==='pre'?'Antes':TS.step==='post'?'Después':TS.step==='done'?'Resultado':'Herramienta'}</span>`)}<div class="stack">${body}</div><div class="footer-btns">${foot}</div>`);

function toolNext(){
  if(TS.step==='pre'){if(!FORM.before){toast('Elegí un número del 1 al 10');return}TS.step='run'}
  else if(TS.step==='run'){if(TS.id==='tcc')TS.data={sit:$('#t-sit').value.trim(),thought:$('#t-th').value.trim(),evid:$('#t-ev').value.trim(),alt:$('#t-alt').value.trim()};TS.step='post'}
  else if(TS.step==='post'){if(!FORM.after){toast('Elegí un número del 1 al 10');return}const e={id:uid(),kind:'ansiedad',ts:Date.now(),tool:TS.id,before:+FORM.before,after:+FORM.after};if(TS.data)e.data=TS.data;S.log.push(e);save();TS.step='done'}

}

  if(FORM.which==='m'){if(!FORM.sleep||!FORM.stress||!FORM.energy){toast('Completá las tres respuestas');return}c.m={sleep:+FORM.sleep,stress:+FORM.stress,energy:+FORM.energy}}
  else{if(!FORM.anx||!FORM.regular){toast('Completá ansiedad y horarios');return}c.n={anx:+FORM.anx,regular:FORM.regular==='si',tool:FORM.tool||null}}
  delete c.demo;S.checkins[k]=c;save();
  if(FORM.which==='m')getPlan(true);
  toast(FORM.which==='m'?'Check-in guardado. El plan de hoy se actualizó.':'Check-in guardado');closeOv();
}

/* Modo crisis */
let CR=null;
function openCrisis(){clearTimers();FORM={};CR={step:'choose',path:null,i:0,t0:null,dur:600};renderCrisis()}
function crTick(){
  const el=$('#cr-t');if(!el||!CR||CR.step!=='solo')return;
  const left=Math.max(0,CR.dur-(Date.now()-CR.t0)/1000);
  el.textContent=`${Math.floor(left/60)}:${pad(Math.floor(left%60))}`;
  const b=$('#cr-b');if(b)b.style.width=(100-left/CR.dur*100).toFixed(1)+'%';
  if(left<=0){const d=$('#cr-done');if(d)d.hidden=false;return}
  later(crTick,1000);
}
function renderCrisis(){
  clearTimers();
  let title='Modo crisis',eb='<span class="eyebrow">Antojo muy fuerte</span>',body='',foot='';
  if(CR.step==='choose'){const cs=S.settings.contacts;
    body=`<p style="font-size:1.15rem">Este impulso va a bajar. Tu único trabajo ahora es ganar 10 minutos.</p>
    <div class="choice"><button class="btn primary" data-a="crPath" data-v="solo">Lo resuelvo yo<small>Guía de 10 minutos, un paso por vez</small></button>
    <button class="btn" data-a="crPath" data-v="persona">Hablar con alguien<small>${cs.length?esc(cs.map(c=>c.name).filter(Boolean).join(', ')):'Llamar o mandar tu mensaje ya escrito'}</small></button></div>
    <p class="hint">Podés usar las dos: mandá el mensaje y, mientras esperás la respuesta, empezá la guía.</p>`}
  if(CR.step==='persona'){title='Hablar con alguien';body=contactsHTML();foot=`<button class="btn primary block" data-a="crPath" data-v="solo">Empezar la guía mientras espero</button>`}
  if(CR.step==='solo'){
    const st=CRISIS[CR.i],last=CR.i===CRISIS.length-1;title=st.t;eb=`<span class="eyebrow">Paso ${CR.i+1} de ${CRISIS.length}</span>`;
    let extra='';
    if(st.breath)extra=breathHTML(st.breath);
    if(st.reasons){const R=S.relapse.reasons;extra=R.length?`<div class="stack">${R.map(r=>`<div class="note accent"><p style="font-size:1.1rem">${esc(r)}</p></div>`).join('')}</div>`:`<p class="muted">Todavía no escribiste tus razones. Escribí una ahora, en una línea: ¿por qué querés salir de esto?</p><div class="row"><input type="text" id="cr-reason" aria-label="Tu razón" style="flex:1;min-width:0" placeholder="Ej.: quiero estar en calma a la noche"><button class="btn soft" data-a="crReason">Guardar</button></div>`}
    if(st.ifthen){const R=S.relapse.ifthen,list=R.length?R:SUG_IF.map(x=>({if:x[0],then:x[1]}));extra=`${R.length?'':'<p class="muted small">Todavía no armaste tu plan. Estos son ejemplos; podés armar el tuyo en Más → Mi plan.</p>'}<div class="stack">${list.map(x=>`<div class="card ifthen"><p><span class="muted">Si</span> ${esc(x.if)},</p><p><span class="muted">entonces</span> <b>${esc(x.then)}</b>.</p></div>`).join('')}</div>`}
    if(st.alts)extra=chips('alt',S.settings.alts.map(a=>[a,a]));
    body=`<div class="stack-s"><div class="row between"><span class="timer" id="cr-t">10:00</span><span class="muted small">para que baje</span></div><div class="bar-p"><i id="cr-b" style="width:0"></i></div></div>
    <div class="stack">${st.d?`<p style="font-size:1.1rem">${st.d}</p>`:''}${st.warn?`<p class="hint">${st.warn}</p>`:''}${extra}<p class="hint">${st.src}</p></div>
    <div id="cr-done" class="note accent" hidden><p><b>Pasaron 10 minutos.</b> Fijate cómo está el antojo ahora.</p></div>`;
    foot=last?`<button class="btn primary block" data-a="crEnd">Ver cómo está el antojo</button>`:`<button class="btn primary block" data-a="crNext">Hecho, siguiente</button><button class="btn block" data-a="crEnd">Ya bajó, terminar</button>`;
  }
  if(CR.step==='end'){title='¿Cómo está ahora?';eb='<span class="eyebrow">Modo crisis</span>';
    body=`<div class="field"><span class="lab">¿Qué tan fuerte era al empezar?</span>${scale('before')}</div><div class="field"><span class="lab">¿Y ahora?</span>${scale('after')}</div><div class="field"><span class="lab">¿Qué pasó?</span>${chips('outcome',OUTCOME)}</div>`;
    foot=`<button class="btn primary block" data-a="crSave">Guardar</button>`}
  if(CR.step==='done'){const{b,a}=CR.res,d=b-a;title='Resultado';eb='<span class="eyebrow">Modo crisis</span>';
    body=`<div class="card"><div class="row" style="gap:24px"><div class="stack-s"><span class="eyebrow">Al empezar</span><span class="big-num">${b}</span></div><span class="muted" aria-hidden="true">→</span><div class="stack-s"><span class="eyebrow">Ahora</span><span class="big-num">${a}</span></div></div>
    <p>${d>0?`Bajó ${d} ${d===1?'punto':'puntos'}. El impulso subió y bajó sin que lo obedecieras.`:'Sigue alto. Podés hacer otros 10 minutos o hablar con alguien.'}</p></div>`;
    foot=`<button class="btn primary block" data-a="close">Volver al inicio</button><button class="btn block" data-a="crPath" data-v="solo">Otros 10 minutos</button><button class="btn block" data-a="crPath" data-v="persona">Hablar con alguien</button>`}
  openOv(`${head(title,eb)}<div class="stack">${body}</div>${foot?`<div class="footer-btns">${foot}</div>`:''}`);
  if(CR.step==='solo')crTick();
}
function crSave(){
  if(!FORM.before||!FORM.after||!FORM.outcome){toast('Completá las tres respuestas');return}
  const now=Date.now(),t0=CR.t0||now;
  S.log.push({id:uid(),kind:'crisis',ts:now,before:+FORM.before,after:+FORM.after,path:CR.path||'solo',outcome:FORM.outcome,alt:FORM.alt||null,min:Math.max(0,Math.round((now-t0)/6e4))});
  const e={id:uid(),kind:'antojo',ts:t0,int:+FORM.before,did:FORM.outcome==='episodio'?'dulce':'crisis'};
  if(FORM.outcome==='episodio')e.control='si';
  S.log.push(e);save();
  if(FORM.outcome==='episodio'){openPost(e);return}
  CR.res={b:+FORM.before,a:+FORM.after};CR.step='done';renderCrisis();
}

/* Después de un episodio */
function openPost(ep){
  clearTimers();FORM={};
  S.pendingChain={id:ep.id,ts:ep.ts};save();
  const nx=mealState().next;
  const li=(t,d)=>`<div class="li"><div class="stack-s"><b>${t}</b><span>${d}</span></div></div>`;
  openOv(`${head('Ya pasó. Ahora, lo que sigue','<span class="eyebrow">Después de un episodio</span>')}
  <p>Quedó registrado como un dato. Lo que hagas en las próximas horas pesa más que lo que ya pasó.</p>
  <div class="card"><div class="list">
    ${li('No compenses','No saltees la próxima comida ni hagas ejercicio de más. Compensar alimenta el ciclo de restricción y descontrol.')}
    ${li('Tu próxima comida',nx?`${esc(nx.n)} a las ${nx.t}. Hacela aunque no tengas mucha hambre.`:'Volvé a tu horario habitual en la próxima comida.')}
    ${li('El «ya fue»','Pensar «ya arruiné el día, sigo» es parte del ciclo, no un hecho. Un episodio no arruina el día ni la semana.')}
    ${li('Cómo te hablás','Hablate como le hablarías a un amigo en tu lugar.')}
  </div></div>
  <div class="footer-btns"><button class="btn primary block" data-a="chain">Entender qué pasó (5 min)</button><button class="btn block" data-a="tool" data-v="defu">Trabajar el «ya fue»</button><button class="btn block" data-a="crPersona">Hablar con alguien</button><button class="btn ghost" data-a="close">Lo hago más tarde</button></div>`);
}

/* Análisis en cadena (DBT) */
function openChain(){
  clearTimers();FORM={vuln:[]};const ep=S.pendingChain;
  openOv(`${head('Análisis en cadena',`<span class="eyebrow">DBT${ep?' · episodio del '+dShort(ep.ts)+', '+hm(ep.ts):''}</span>`)}
  <p class="muted">Recorré el episodio como una cadena de eslabones. La idea es encontrar dónde podés cortarla la próxima vez, no juzgarte.</p>
  <div class="field"><span class="lab">¿Qué te dejó más vulnerable ese día?</span>${chips('vuln',VULN.map(v=>[v,v]),{multi:true})}</div>
  <div class="field"><label for="ch-trig">¿Qué pasó justo antes?</label><textarea id="ch-trig" placeholder="Ej.: salí del trabajo y pasé por el kiosco"></textarea></div>
  <div class="field"><label for="ch-links">Los eslabones, en orden</label><textarea id="ch-links" placeholder="Pensamientos, emociones, sensaciones. Ej.: cansancio → «me lo merezco» → ansiedad → compré"></textarea></div>
  <div class="field"><label for="ch-after">¿Qué pasó después? ¿Cómo te sentiste?</label><textarea id="ch-after"></textarea></div>
  <div class="field"><label for="ch-cut">¿Dónde podrías cortar la cadena la próxima vez?</label><textarea id="ch-cut" placeholder="Ej.: comer la merienda antes de salir del trabajo"></textarea></div>
  <label class="envrow"><input type="checkbox" id="ch-plan" checked><span>Agregarlo a mi plan como «si… entonces…»</span></label>
  <label class="envrow"><input type="checkbox" id="ch-ses" checked><span>Llevarlo a mi próxima sesión</span></label>
  <div class="footer-btns"><button class="btn primary block" data-a="chainSave">Guardar</button></div>`);
}
function chainSave(){
  const g=id=>$('#'+id).value.trim(),ep=S.pendingChain;
  const c={id:uid(),kind:'cadena',ts:Date.now(),ep:ep&&ep.id,vuln:FORM.vuln||[],trig:g('ch-trig'),links:g('ch-links'),after:g('ch-after'),cut:g('ch-cut')};
  if(!c.trig&&!c.links&&!c.cut){toast('Completá al menos qué pasó antes o dónde cortar');return}
  S.log.push(c);
  if($('#ch-plan').checked&&c.trig&&c.cut)S.relapse.ifthen.push({if:c.trig,then:c.cut});
  if($('#ch-ses').checked)addNote(`Episodio del ${dShort(ep?ep.ts:c.ts)}: `+[c.vuln.length?'vulnerable por '+c.vuln.join(', ').toLowerCase():'',c.trig?'antes: '+c.trig:'',c.cut?'cortar en: '+c.cut:''].filter(Boolean).join(' · '));
  S.pendingChain=null;save();toast('Análisis guardado');closeOv();
}

/* Nota rápida para la sesión */
function openNote(){FORM={};openOv(`${head('Nota para la sesión','<span class="eyebrow">Entre sesiones</span>')}<div class="field"><label for="note-in">¿Qué querés contarle o preguntarle a tu psicólogo?</label><textarea id="note-in" placeholder="Ej.: el martes tuve un episodio después de discutir; quiero ver qué hacer con eso"></textarea></div><div class="footer-btns"><button class="btn primary block" data-a="noteSave">Guardar</button></div>`)}

/* Exportar / importar */
function toCSV(){
  const cols=['fecha','hora','tipo','intensidad','emocion','situacion','hambre','que_hice','perdida_control','antes','despues','herramienta','accion_alternativa','sueno','estres','energia','ansiedad_dia','horarios_regulares','detalle'];
  const q=v=>{v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=S.log.map(e=>[dk(e.ts),hm(e.ts),e.kind,e.int,e.emo,e.sit,e.hunger,e.did,e.control,e.before,e.after,e.tool,e.alt,'','','','','',e.kind==='crisis'?`${e.path}/${e.outcome}`:e.kind==='cadena'?`${e.trig||''} → ${e.cut||''}`:'']);
  Object.entries(S.checkins).sort().forEach(([d,c])=>{if(c.m)rows.push([d,'','checkin_manana','','','','','','','','','','',c.m.sleep,c.m.stress,c.m.energy,'','','']);if(c.n)rows.push([d,'','checkin_noche','','','','','','','','',c.n.tool||'','','','','',c.n.anx,c.n.regular?'si':'no',''])});
  return [cols.join(','),...rows.map(r=>r.map(q).join(','))].join('\n');
}
let expKind='json';

/* ---------- Acciones ---------- */
let wipeArmed=false,impArmed=false;
const ACT={
  tab:v=>{if(!ov.hidden){clearTimers();ov.hidden=true;ov.innerHTML='';document.body.style.overflow=''}V.tab=v;V.sub=null;render(true)},
  sub:v=>{V.tab='mas';V.sub=v||null;if(!ov.hidden){clearTimers();ov.hidden=true;ov.innerHTML='';document.body.style.overflow=''}render(true)},
  range:v=>{V.range=+v;render()},
  log:v=>openLog(v),
  saveLog:v=>saveLog(v),
  sos:()=>openSOS(null),
  sosNext:v=>sosNext(v==='skip'),
  sosAgain:()=>{SOS.step=1;renderSOS()},
  sosContact:()=>{const old=$('#ov .sos-contacts');if(old){old.remove();return}const box=document.createElement('div');box.className='sos-contacts';box.innerHTML=contactsHTML();$('#sos-body').before(box)},
  crisis:()=>openCrisis(),
  crPath:v=>{if(v==='solo'){CR.path=CR.path==='persona'||CR.path==='ambos'?'ambos':'solo';CR.step='solo';CR.i=0;CR.t0=Date.now()}else{CR.path=CR.path==='solo'?'ambos':'persona';CR.step='persona'}renderCrisis()},
  crNext:()=>{if(CR.i<CRISIS.length-1){CR.i++;renderCrisis()}},
  crEnd:()=>{CR.step='end';renderCrisis()},
  crSave:()=>crSave(),
  crPersona:()=>{openCrisis();CR.path='persona';CR.step='persona';renderCrisis()},
  crReason:()=>{const v=$('#cr-reason').value.trim();if(!v){toast('Escribí tu razón');return}S.relapse.reasons.push(v);save();renderCrisis()},
  copyMsg:()=>{const m=S.settings.message;const sel=()=>{const el=$('#msg-txt');if(el){const r=document.createRange();r.selectNodeContents(el);const w=getSelection();w.removeAllRanges();w.addRange(r)}toast('Texto seleccionado: copialo con el menú')};try{navigator.clipboard.writeText(m).then(()=>toast('Mensaje copiado'),sel)}catch(e){sel()}},
  chain:()=>openChain(),
  chainSave:()=>chainSave(),
  chainSkip:()=>{S.pendingChain=null;save();render()},
  meal:v=>{const k=dk(Date.now()),d=S.meals[k]=S.meals[k]||{};if(d[v])delete d[v];else d[v]=Date.now();save();render()},
  note:()=>openNote(),
  noteSave:()=>{const t=$('#note-in').value.trim();if(!t){toast('Escribí la nota');return}addNote(t);toast('Nota guardada para la sesión');closeOv()},
  noteDel:v=>{S.notes=S.notes.filter(n=>n.id!==v);save();render()},
  sesDone:()=>{const ss=S.settings.session;S.notes.forEach(n=>{n.done=true});ss.last=dk(Date.now());const d=new Date();d.setDate(d.getDate()+(+ss.freq||14));ss.next=dk(d);save();toast('Listo. Próxima sesión: '+dShort(d));render()},
  cDel:v=>{S.settings.contacts.splice(+v,1);save();render()},
  lsDel:v=>{const[k,i]=v.split(':');S.relapse[k].splice(+i,1);save();render()},
  lsAdd:v=>{const[k,i]=v.split(':');S.relapse[k].push(SUG[k][+i]);save();render()},
  ifDel:v=>{S.relapse.ifthen.splice(+v,1);save();render()},
  ifAdd:v=>{const x=SUG_IF[+v];S.relapse.ifthen.push({if:x[0],then:x[1]});save();render()},
  env:(v,b)=>{S.relapse.envOn[v]=b.checked;save()},
  tool:v=>openTool(v),
  toolNext:()=>toolNext(),
  groundNext:()=>{TS.g++;renderTool()},
  beck:v=>{const b=BECK[+v];$('#t-th').value=b[0];if(!$('#t-alt').value)$('#t-alt').value=b[1]},
  defuGo:()=>{const t=$('#d-in').value.trim();if(!t){toast('Escribí el pensamiento primero');return}$('#d-out').innerHTML=[t,`Estoy teniendo el pensamiento de que ${t.charAt(0).toLowerCase()+t.slice(1)}.`,`Me doy cuenta de que estoy teniendo el pensamiento de que ${t.charAt(0).toLowerCase()+t.slice(1)}.`].map((s,i)=>`<div class="note ${i===2?'accent':''}"><p class="${i===0?'':'small muted'}" style="${i?'':'font-size:1.05rem'}">${i===0?'«'+esc(s)+'»':esc(s)}</p></div>`).join('')+'<p class="muted small">Leelas despacio, en orden. El pensamiento puede seguir ahí; vos elegís qué hacer.</p>'},
  breathGo:v=>startBreath(+v),
  surfDur:v=>{if(raf)return;FORM.dur=v;$$('#ov .seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))},
  surfGo:()=>startSurf(),
  close:()=>closeOv(),
  checkin:v=>openCheckin(v),
  saveCheckin:()=>saveCheckin(),
  planDone:(v,b)=>{const p=getPlan();p.done=b.checked?[...new Set([...p.done,v])]:p.done.filter(x=>x!==v);save();b.closest('.check').classList.toggle('done',b.checked)},
  clearDemo:()=>{clearDemo();toast('Listo. Empezás de cero.');render(true)},
  altDel:v=>{S.settings.alts.splice(+v,1);save();render()},
  notify:()=>{if(!('Notification' in window)){toast('Este navegador no permite notificaciones');return}Notification.requestPermission().then(p=>{S.settings.remind=p==='granted';save();scheduleReminder();render();toast(p==='granted'?'Notificaciones activadas':'No se activaron las notificaciones')}).catch(()=>toast('No se pudieron activar'))},
  exp:v=>{expKind=v;$('#exp-box').hidden=false;$('#exp-txt').value=v==='json'?JSON.stringify(S,null,1):toCSV()},
  copy:()=>{const ta=$('#exp-txt');const sel=()=>{ta.focus();ta.select();toast('Texto seleccionado: copialo con Ctrl+C o el menú')};try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copiado'),sel)}catch(e){sel()}},
  download:()=>{const blob=new Blob([$('#exp-txt').value],{type:expKind==='json'?'application/json':'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pausa-${dk(Date.now())}.${expKind}`;document.body.appendChild(a);a.click();a.remove()},
  imp:(v,b)=>{let o;try{o=JSON.parse($('#imp-txt').value)}catch(e){toast('El texto no es un JSON válido');return}if(!o||o.v!==1||!Array.isArray(o.log)){toast('Ese archivo no es un respaldo de Pausa');return}if(!impArmed){impArmed=true;b.textContent='Tocá de nuevo para reemplazar tus datos';return}impArmed=false;S=o;migrate();save();scheduleReminder();toast(`Importados ${S.log.length} registros`);render(true)},
  wipe:(v,b)=>{if(!wipeArmed){wipeArmed=true;b.textContent='Tocá de nuevo para borrar todo';later(()=>{wipeArmed=false;if(b.isConnected)b.textContent='Borrar todos mis datos'},5000);return}wipeArmed=false;S=blank();save();toast('Datos borrados');V.sub=null;V.tab='inicio';render(true)},
  chip:(v,b)=>{const g=b.dataset.g,grp=b.closest('[data-group]');
    if(grp.dataset.multi){const a=FORM[g]||[];FORM[g]=a.includes(v)?a.filter(x=>x!==v):[...a,v];b.setAttribute('aria-pressed',FORM[g].includes(v))}
    else{FORM[g]=v;$$('.chip',grp).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===FORM[g]))}
    FORM.__on&&FORM.__on(g)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(!ACT[a])return;if(b.tagName==='A')return;if(b.type!=='checkbox')e.preventDefault();ACT[a](b.dataset.v,b,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeOv()});
window.addEventListener('resize',()=>{if($('#surfc')&&!raf)drawSurf(0)});

/* Recordatorio local (versión instalada) */
let remT=[];
function scheduleReminder(){
  remT.forEach(clearTimeout);remT=[];
  if(!IS_PWA||!S.settings.remind||!('Notification' in window)||Notification.permission!=='granted')return;
  const notify=body=>{if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification('Pausa',{body,tag:'pausa'})).catch(()=>{});else try{new Notification('Pausa',{body})}catch(e){}};
  const at=(h,m,body)=>{const t=new Date();t.setHours(h,m,0,0);const ms=t.getTime()-Date.now();if(ms>0)remT.push(setTimeout(()=>notify(body),ms))};
  const rw=riskWindow();if(rw)at(rw.h,rw.m,`Se acerca tu franja de mayor antojo (${rw.peak.start}–${rw.peak.end} h). Una pausa de un minuto ahora.`);
  mealsOn().forEach(m=>{const[h,mi]=m.t.split(':').map(Number);at(h,mi,`Hora de tu ${m.n.toLowerCase()}. Idea: ${idea(m.id).toLowerCase()}.`)});
}
if(IS_PWA&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}

render();
scheduleReminder();
})();
</script>
